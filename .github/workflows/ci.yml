name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Plugin test suite (KiraAI host @ main)
    runs-on: ubuntu-latest
    steps:
      # Order matters: the host checkout runs `git clean -ffdx` on its fresh
      # tree, which would wipe a plugin directory placed first, so the host
      # must land before the plugin.
      - name: Checkout KiraAI host
        uses: actions/checkout@v4
        with:
          repository: xxynet/KiraAI
          ref: main
          path: KiraAI

      # The suite expects the plugin to live at
      # data/plugins/kira-ai-plugin-noriengine-chat inside a KiraAI checkout
      # (tests/test_host_smoke.py walks up from the plugin directory to find
      # the host root containing core/).
      - name: Checkout plugin into host layout
        uses: actions/checkout@v4
        with:
          path: KiraAI/data/plugins/kira-ai-plugin-noriengine-chat

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r KiraAI/requirements.txt
          pip install pytest pytest-asyncio

      # Run from the plugin root: the tests import the plugin modules with
      # bare `import main` / `import noriengine_*`, so running from the host
      # root would shadow the plugin's main.py with the host entry script.
      # The real-host smoke test locates the host checkout by walking up
      # from the plugin directory on its own.
      - name: Run tests
        working-directory: KiraAI/data/plugins/kira-ai-plugin-noriengine-chat
        run: python -m pytest tests -q
